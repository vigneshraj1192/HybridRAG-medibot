version: '3.8'

services:
  backend:
    build: .
    container_name: medibot_backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-medibot_super_secret_jwt_key_2026}
      - PORT=${PORT:-8000}
    volumes:
      - ./qdrant_db:/app/qdrant_db
      - ./data:/app/data
    restart: unless-stopped
